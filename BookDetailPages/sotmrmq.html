<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>내가 키운 S급들</title>
    <link rel="stylesheet" href="../header.css" />
    <link rel="stylesheet" href="../BookDetailPages/DetailPages.css" />
  </head>
  <body>
    <div class="header">
      <a href="../main.html" class="home">Web_Library</a>
      <a
        href="../categoryPages/genrePage/genre-romanceFantasy.html"
        class="headCategory"
        id="genre-hover"
        >장르</a
      >
      <a href="/" class="headCategory" id="site-hover">사이트</a>
      <a href="/" class="headCategory" id="webtoonOrWebnovel-hover">매체</a>
      <a href="/" class="headCategory" id="subCategory-hover">보관함</a>
      <a
        href="../randomPage/randomRoulette.html"
        class="headCategory"
        id="randomRoulette-hover"
        >랜덤 룰렛</a
      >
      <a href="/" class="login">로그인</a>
    </div>
    <div id="leftBox">
      <img src="../Leaps/1-removebg-preview.png" alt="흩날리는 나뭇잎들" />
      <img src="../Leaps/2-removebg-preview.png" alt="조금 다르게 흩날려보기" />
      <img src="../Leaps/3-removebg-preview.png" alt="또 다르게 흩날리기" />
    </div>
    <div id="center">
      <div class="BookDetailPagesCard">
        <img
          src="https://search.pstatic.net/common?type=f&size=174x226&quality=75&direct=true&src=https%3A%2F%2Fshared-comic.pstatic.net%2Fthumb%2Fwebtoon%2F784248%2Fthumbnail%2Fthumbnail_IMAG21_5ec2a5b8-167a-497b-8316-5bb38abe6f74.jpg"
          alt="작품 표지"
          class="bookCover-detailPage"
        />
        <div class="bookInformation">
          <p class="bookName">내가 키운 S급들</p>
          <p>연재 사이트 | 네이버 웹툰</p>
          <p>장르 | 현대 판타지</p>
          <p>매체 | 웹툰</p>
          <p class="writer">작가</p>
          <div class="writerCard">
            <p class="writerText">스토리 | seri</p>
            <p class="writerText">작화 | 비완</p>
            <p class="writerText">원작 | 근서</p>
          </div>
          <a
            href="https://comic.naver.com/webtoon/list?titleId=784248"
            id="bookLink"
            >작품 바로보러 가기!</a
          >
        </div>
        <div id="StoryInformationCard">
          <input type="checkbox" id="bookStory" />
          <label for="bookStory">
            <span id="StoryName">작품 소개</span>
            <span id="StorySome">
              F급 헌터. <br />
              그것도 잘나가는 S급 동생 발목이나 잡는 쓸모없고 찌질한 F급 형.
              <br />
              개판된 인생 대충 살다가 결국 동생 목숨까지 잡아먹고... <br />
            </span>

            <span id="more">더보기</span>
          </label>

          <div class="otherStoryLineCard">
            <p>
              F급 헌터. <br />
              그것도 잘나가는 S급 동생 발목이나 잡는 쓸모없고 찌질한 F급 형.
              <br />
              개판된 인생 대충 살다가 결국 동생 목숨까지 잡아먹고 회귀한 내게
              주어진 칭호, <br />
              '완벽한 양육자'. <br />
              그래, 이번에는 나대지 말고 얌전히 잘난놈들 뒷바라지나 해 주자.
              <br />
              라고 생각했는데, S급들이 좀 이상하다.
            </p>
          </div>
        </div>
      </div>
      <div id="BookMemoCard">
        <p id="memo">메모</p>
        <textarea
          name="memo"
          id="BookMemo"
          data-storage-key="memo-sotmrmqToon"
          placeholder="작품에 대한 감상을 적어보세요"
        ></textarea>
      </div>
    </div>
    <div id="rightBox">
      <img src="../Leaps/2-removebg-preview.png" alt="어쨌든 흩날림" />
      <img
        src="../Leaps/3-removebg-preview.png"
        alt="보이지 않겠지만 흩날리고 있어요"
      />
      <img
        src="../Leaps/1-removebg-preview.png"
        alt="착한사람에게만 보이는 나뭇잎들"
      />
    </div>
    <script src="./Memo.js"></script>
  </body>
</html>
