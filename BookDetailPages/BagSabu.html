<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>일타강사 백사부</title>
    <!--========-->
    <link rel="stylesheet" href="../header.css" />
    <link rel="stylesheet" href="../BookDetailPages/DetailPages.css" />
  </head>
  <body>
    <div class="header">
      <a href="../main.html" class="home">Web_Library</a>
      <a
        href="../categoryPages/genrePage/genre-romanceFantasy.html"
        class="headCategory"
        id="genre-hover"
        >장르</a
      >
      <a
        href="../categoryPages/sitePage/kakaPage.html"
        class="headCategory"
        id="site-hover"
        >사이트</a
      >
      <a
        href="../categoryPages/ToonOrNoveL/webtoon.html"
        class="headCategory"
        id="webtoonOrWebnovel-hover"
        >매체</a
      >
      <a
        href="../categoryPages/AllPages/AllBooks.html"
        class="headCategory"
        id="subCategory-hover"
        >보관함</a
      >
      <a
        href="../randomPage/randomRoulette.html"
        class="headCategory"
        id="randomRoulette-hover"
        >랜덤 룰렛</a
      >
      <a href="/" class="login">로그인</a>
    </div>
    <div id="leftBox">
      <img src="../Leaps/1-removebg-preview.png" alt="흩날리는 나뭇잎들" />
      <img src="../Leaps/2-removebg-preview.png" alt="조금 다르게 흩날려보기" />
      <img src="../Leaps/3-removebg-preview.png" alt="또 다르게 흩날리기" />
    </div>
    <div id="center">
      <div class="BookDetailPagesCard">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzgd3qWkUj06R-XNlX8oCHmt2etT1zmC5Osu-FDKMpDw&s=10"
          alt="작품 표지"
          class="bookCover-detailPage"
        />
        <!--=============-->
        <div class="bookInformation">
          <p class="bookName">일타강사 백사부</p>
          <!--==============-->
          <p>연재 사이트 | 네이버 웹툰</p>
          <!--==========-->
          <p>장르 | 무협</p>
          <!--==========-->
          <p>매체 | 웹툰</p>
          <!--============-->
          <p class="writer">작가</p>
          <div class="writerCard">
            <p class="writerText">스토리 | 리메</p>
            <!--==========-->
            <p class="writerText">작화 | 드로우웨이즈드로우웨이즈</p>
            <!--============-->
            <p class="writerText">원작 | 간짜장</p>
            <!--=============-->
          </div>
          <a
            href="https://comic.naver.com/webtoon/list?titleId=779632"
            id="bookLink"
            >작품 바로보러 가기!</a
          >
          <!--===============-->
        </div>
        <div id="StoryInformationCard">
          <input type="checkbox" id="bookStory" />
          <label for="bookStory">
            <span id="StoryName">작품 소개</span>
            <span id="StorySome">
              혈교 최고의 무공 교관, 시골 무관의 사부로 환생하다. <br />
              그리고 정파 무림의 일타강사로! ...<br />
            </span>

            <span id="more">더보기</span>
          </label>

          <div class="otherStoryLineCard">
            <p>
              <!--===========-->
              혈교 최고의 무공 교관, 시골 무관의 사부로 환생하다. <br />
              그리고 정파 무림의 일타강사로! <br />
              이름하여 백 사부. <br />
              그가 이제 전 무림을 참교육한다!
            </p>
          </div>
        </div>
      </div>
      <div id="BookMemoCard">
        <p id="memo">메모</p>
        <textarea
          name="memo"
          id="BookMemo"
          data-storage-key="memo-BagSabuToon"
          placeholder="작품에 대한 감상을 적어보세요"
        ></textarea
        ><!--==============-->
      </div>
      <div class="similarBooks">
        <p class="similarBooksName">연관 작품</p>
        <a href="../BookDetailPages/BagSabuNovel.html" class="DetailPagesLink">
          <div class="margin2">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWo9jjpmRg0YkEJdILr8uDNmNl0VzoDGVtctIx_xacYA&s=10"
              alt="작품 표지"
              class="bookCover"
            /><!--============-->
            <div class="bookCardText">
              <p class="bookName">일타강사 백사부</p>
              <!--=============-->
              <div class="bookCardText-notName">
                <p class="original">원작</p>
                <p>장르 | 무협</p>
                <!--============-->
                <p>사이트 | 네이버 시리즈</p>
                <!--============-->
                <p>매체 | 웹소설</p>
                <!--============-->
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
    <div id="rightBox">
      <img src="../Leaps/2-removebg-preview.png" alt="어쨌든 흩날림" />
      <img
        src="../Leaps/3-removebg-preview.png"
        alt="보이지 않겠지만 흩날리고 있어요"
      />
      <img
        src="../Leaps/1-removebg-preview.png"
        alt="착한사람에게만 보이는 나뭇잎들"
      />
    </div>
    <script src="./Memo.js"></script>
  </body>
</html>
