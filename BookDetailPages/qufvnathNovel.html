<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>별을 품은 소드마스터</title>
    <!--=====================-->
    <link rel="stylesheet" href="../header.css" />
    <link rel="stylesheet" href="../BookDetailPages/DetailPages.css" />
  </head>
  <body>
    <div class="header">
      <a href="../main.html" class="home">Web_Library</a>
      <a
        href="../categoryPages/genrePage/genre-romanceFantasy.html"
        class="headCategory"
        id="genre-hover"
        >장르</a
      >
      <a href="/" class="headCategory" id="site-hover">사이트</a>
      <a href="/" class="headCategory" id="webtoonOrWebnovel-hover">매체</a>
      <a href="/" class="headCategory" id="subCategory-hover">보관함</a>
      <a
        href="../randomPage/randomRoulette.html"
        class="headCategory"
        id="randomRoulette-hover"
        >랜덤 룰렛</a
      >
      <a href="/" class="login">로그인</a>
    </div>
    <div id="leftBox">
      <img src="../Leaps/1-removebg-preview.png" alt="흩날리는 나뭇잎들" />
      <img src="../Leaps/2-removebg-preview.png" alt="조금 다르게 흩날려보기" />
      <img src="../Leaps/3-removebg-preview.png" alt="또 다르게 흩날리기" />
    </div>
    <div id="center">
      <div class="BookDetailPagesCard">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScC3xY_q9b7ZMxoANsUVPBhF04qxgARoIblex3LgRRLA&s=10"
          alt="작품 표지"
          class="bookCover-detailPage"
        />
        <!--=============================-->
        <div class="bookInformation">
          <p class="bookName">별을 품은 소드마스터</p>
          <!--==============================-->
          <p>연재 사이트 | 네이버 시리즈</p>
          <!--===================================-->
          <p>장르 | 판타지</p>
          <!--=================================-->
          <p>매체 | 웹소설</p>
          <!--==============================-->
          <p class="writer">작가</p>
          <div class="writerCard">
            <p class="writerText">작가 | Q10</p>
          </div>
          <a
            href="https://series.naver.com/novel/detail.series?productNo=6307545"
            id="bookLink"
            >작품 바로보러 가기!</a
          >
          <!--==========================-->
        </div>
        <div id="StoryInformationCard">
          <input type="checkbox" id="bookStory" />
          <label for="bookStory">
            <span id="StoryName">작품 소개</span>
            <span id="StorySome">
              높디높은 밤하늘에 있지 않더라도 <br />
              아무도 보지 못하는 곳에 떨어져 있더라도 <br />
              스스로가 빛나기를 원한다면 ...<br />
            </span>
            <!--========================-->
            <span id="more">더보기</span>
          </label>

          <div class="otherStoryLineCard">
            <p>
              <!--=============================-->
              높디높은 밤하늘에 있지 않더라도 <br />
              아무도 보지 못하는 곳에 떨어져 있더라도 <br />
              스스로가 빛나기를 원한다면 <br />
              그렇다면 그것은 별일것이다.
            </p>
          </div>
        </div>
      </div>
      <div id="BookMemoCard">
        <p id="memo">메모</p>
        <textarea
          name="memo"
          id="BookMemo"
          data-storage-key="memo-qufvnathNovel"
          placeholder="작품에 대한 감상을 적어보세요"
        ></textarea>
        <!--==========================-->
      </div>
      <div class="similarBooks">
        <p class="similarBooksName">연관 작품</p>
        <a href="../BookDetailPages/qufvnath.html" class="DetailPagesLink">
          <!--===============================-->
          <div class="margin2">
            <img
              src="https://search.pstatic.net/common?type=f&size=174x226&quality=75&direct=true&src=https%3A%2F%2Fshared-comic.pstatic.net%2Fthumb%2Fwebtoon%2F816809%2Fthumbnail%2Fthumbnail_IMAG21_7cdbae7a-df9f-4277-9e40-844c0dbd1af3.jpg"
              alt="작품 표지"
              class="bookCover"
            />
            <!--===============================-->
            <div class="bookCardText">
              <p class="bookName">별을 품은 소드마스터</p>
              <!--=================================-->
              <div class="bookCardText-notName">
                <p>장르 | 판타지</p>
                <!--==============================-->
                <p>사이트 | 네이버 웹툰</p>
                <!--====================================-->
                <p>매체 | 웹툰</p>
                <!--================================-->
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>
    <div id="rightBox">
      <img src="../Leaps/2-removebg-preview.png" alt="어쨌든 흩날림" />
      <img
        src="../Leaps/3-removebg-preview.png"
        alt="보이지 않겠지만 흩날리고 있어요"
      />
      <img
        src="../Leaps/1-removebg-preview.png"
        alt="착한사람에게만 보이는 나뭇잎들"
      />
    </div>
    <script src="./Memo.js"></script>
  </body>
</html>
